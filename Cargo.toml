[package]
name = "brokk-tree-sitter-kotlin"
description = "Brokk-maintained Kotlin grammar for the tree-sitter parsing library"
version = "0.4.0"
keywords = ["incremental", "parsing", "kotlin"]
categories = ["parser-implementations", "text-editors"]
repository = "https://github.com/BrokkAi/tree-sitter-kotlin"
homepage = "https://github.com/BrokkAi/tree-sitter-kotlin"
edition = "2021"
license = "MIT"
readme = "bindings/rust/README.md"

build = "bindings/rust/build.rs"
include = [
  "/LICENSE",
  "/bindings/rust/*",
  "/grammar.js",
  "/queries/*",
  "/src/*",
  "/tree-sitter.json",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.1"

[dev-dependencies]
tree-sitter = "0.24"
tree-sitter-kotlin-sg = "=0.4.1"
