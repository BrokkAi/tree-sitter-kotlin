name: Build

on:
  push:
    branches:
    - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate parser
        run: npm run generate
      - name: Verify that generated parser matches the repository
        run: |
          diff=`git diff HEAD -- src`
          echo "$diff"
          test -z "$diff"
      - name: Check the parser size
        run: |
          size_kib="$(du -sk src/parser.c | cut -f1)"
          size_mib="$((size_kib / 1024))"
          max_size_mib=60

          echo "The parser is now at $size_mib MiB"
          if [ "$size_mib" -gt "$max_size_mib" ]; then
            echo "This is greater than the maximum size of $max_size_mib MiB!"
            exit 1
          fi
        shell: bash
      - name: Run tests
        run: npm test
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # 1.97.1
        with:
          toolchain: '1.97.1'
      - name: Build and test crate
        run: cargo test --locked
      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.26.0'
          cache: true
      - name: Test Go binding
        run: go test -mod=readonly ./...
